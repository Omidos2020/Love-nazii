<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#faf9f6">
<title>برای نازی</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#faf9f6;color:#292929;font-family:Tahoma,Arial,sans-serif;display:grid;place-items:center;padding:24px}
main{width:min(100%,460px);min-height:360px;display:grid;place-items:center;text-align:center}
.screen{display:none;width:100%;animation:appear .35s ease}
.screen.active{display:block}
.mark{font-size:27px;color:#b98d8d;margin-bottom:28px}
h1{font-size:clamp(23px,6vw,31px);font-weight:500;line-height:1.9;margin:0 0 28px}
p{font-size:15px;line-height:2;color:#777;margin:22px 0 0}
.buttons{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:28px}
button{font:15px Tahoma,Arial,sans-serif;padding:13px 27px;border-radius:7px;cursor:pointer;transition:transform .2s,background .2s}
.primary{background:#292929;color:white;border:1px solid #292929}
.secondary{background:transparent;color:#292929;border:1px solid #d5d1cc}
.primary:active,.secondary:active{transform:scale(.97)}
#yesBtn{transform:scale(1);transition:transform .25s ease}
@keyframes appear{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<main>
<section class="screen active" id="screen1">
<div class="mark">♡</div>
<h1>سالاممم صبح بخیر خانم ولینژاد</h1>
<div class="buttons"><button class="primary" onclick="showScreen(2)">صبح توم بخیر</button></div>
</section>
<section class="screen" id="screen2">
<div class="mark">☀</div>
<h1>صبحونه خوردی؟</h1>
<div class="buttons">
<button class="primary" onclick="showScreen(3)">اره</button>
<button class="secondary" type="button">نه</button>
</div>
</section>
<section class="screen" id="screen3">
<div class="mark">♡</div>
<h1>پیشی بالام منو دوس داری؟</h1>
<div class="buttons">
<button class="primary" id="yesBtn" onclick="showScreen(4)">اره</button>
<button class="secondary" id="noBtn" onclick="growYes()">نه</button>
</div>
<p>اگه جرعت داری بزن رو نه</p>
</section>
<section class="screen" id="screen4">
<div class="mark">♡</div>
<h1>می‌دونستم!</h1>
<p>این لبخند قشنگت همیشه روی لبت بمونه خانم ولینژاد</p>
</section>
</main>
<script>
function showScreen(n){
 document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
 document.getElementById('screen'+n).classList.add('active');
}
let clicks=0;
function growYes(){
 clicks++;
 document.getElementById('yesBtn').style.transform='scale('+Math.min(1+clicks*.38,4.2)+')';
 if(clicks>=5) document.getElementById('noBtn').style.opacity='.35';
}
</script>
</body>
</html>
