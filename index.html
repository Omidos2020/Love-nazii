<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#251326">
<title>صبح بخیر خانم ولینژاد ❤️</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 15% 10%,#78436b 0,#3b2344 38%,#1d172b 100%);color:#fff;font-family:Tahoma,Arial,sans-serif;overflow:hidden}
.card{position:relative;width:min(100%,520px);min-height:390px;padding:38px 24px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border:1px solid #ffffff30;border-radius:30px;background:#ffffff12;backdrop-filter:blur(12px);box-shadow:0 22px 70px #0005;overflow:hidden}
.heart{font-size:62px;line-height:1.3;animation:pulse 1.35s infinite}
h1{font-size:clamp(25px,7vw,36px);line-height:1.8;margin:10px 0;color:#ffe0ed}
p{font-size:18px;line-height:2.1;color:#fff0f6;margin:8px 0 22px}
.buttons{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;width:100%;min-height:72px;margin-top:8px}
button{border:0;border-radius:999px;padding:14px 28px;font: bold 17px Tahoma,Arial,sans-serif;color:#fff;cursor:pointer;touch-action:manipulation}
.primary{background:linear-gradient(100deg,#ff6b9d,#c85bda);box-shadow:0 8px 24px #e75b9b55}
.secondary{background:#ffffff20;border:1px solid #ffffff55}
.screen{display:none;width:100%;flex-direction:column;align-items:center}
.screen.active{display:flex}
.note{font-size:14px;color:#ffd6e7;margin-top:18px}
#yesBtn{transform:scale(1);transition:transform .25s ease}
.spark{position:fixed;bottom:-30px;color:#ffb3d0;opacity:.55;animation:rise linear infinite;pointer-events:none}
@keyframes pulse{50%{transform:scale(1.13)}}
@keyframes rise{to{transform:translateY(-110vh) rotate(360deg);opacity:0}}
</style>
</head>
<body>
<main class="card">
  <section class="screen active" id="screen1">
    <div class="heart">🌸</div>
    <h1>سالاممم صبح بخیر خانم ولینژاد</h1>
    <div class="buttons"><button class="primary" onclick="showScreen(2)">صبح توام بخیر ☀️</button></div>
  </section>
  <section class="screen" id="screen2">
    <div class="heart">🥐</div>
    <h1>صبحونه خوردی؟</h1>
    <div class="buttons">
      <button class="primary" onclick="showScreen(3)">آره 😋</button>
      <button class="secondary" type="button">نه 🙈</button>
    </div>
  </section>
  <section class="screen" id="screen3">
    <div class="heart">💗</div>
    <h1>پیشی بالام، منو دوس داری؟</h1>
    <div class="buttons">
      <button class="primary" id="yesBtn" onclick="sayYes()">آره ❤️</button>
      <button class="secondary" id="noBtn" onclick="growYes()">نه 😏</button>
    </div>
    <div class="note">اگه جرعت داری بزن رو نه 😜</div>
  </section>
  <section class="screen" id="screen4">
    <div class="heart">🥰</div>
    <h1>می‌دونستم! ❤️</h1>
    <p>این لبخند قشنگت همیشه روی لبت بمونه خانم ولینژاد 🌷</p>
  </section>
</main>
<script>
function showScreen(n){
 document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
 document.getElementById('screen'+n).classList.add('active');
}
let clicks=0;
function growYes(){
 clicks++;
 const yes=document.getElementById('yesBtn');
 yes.style.transform='scale('+Math.min(1+clicks*.38,4.2)+')';
 if(clicks>=5){document.getElementById('noBtn').style.opacity='.35';}
}
function sayYes(){showScreen(4);}
for(let i=0;i<20;i++){
 const s=document.createElement('span');s.className='spark';s.textContent='♥';
 s.style.left=Math.random()*100+'vw';s.style.animationDuration=(7+Math.random()*9)+'s';
 s.style.animationDelay=(-Math.random()*12)+'s';s.style.fontSize=(12+Math.random()*20)+'px';
 document.body.appendChild(s);
}
</script>
</body>
</html>
